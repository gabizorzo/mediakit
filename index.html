<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Gabi Zorzo (@gabizorzo): cupons das marcas parceiras e mídia kit.">
<meta property="og:url" content="https://gabizorzo.com/">
<link rel="canonical" href="https://gabizorzo.com/">
<meta property="og:title" content="Gabi Zorzo | @gabizorzo">
<meta property="og:description" content="Levo uma vida em movimento sem abrir mão do equilíbrio. Atleta híbrida que fala né?">
<meta property="og:image" content="https://gabizorzo.com/img/corrida.jpg">
<meta name="twitter:card" content="summary_large_image">
<title>Gabi Zorzo | @gabizorzo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Archivo:wght@400;500;700;800&display=swap">
<style>
/* Front door: name, one line, two ruled rows. Same identity as the media kit. */
:root{
  --paper:#f6f4ef;
  --ink:#121211;
  --soft:#5d5b56;
  --rule:#12121126;
  --on-ink:#f6f4ef;
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --accent-face:'Instrument Serif','Times New Roman',serif;
  --text:'Archivo','Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box}
img{max-width:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--text);padding-inline:16px;padding-block:0 40px}
a{color:inherit}
a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.frame{max-width:620px;margin:0 auto;border-inline:1px solid var(--rule)}
.frame>*{border-bottom:1px solid var(--rule)}
h1,h2{font-family:var(--display);font-weight:800;text-transform:uppercase;margin:0;letter-spacing:-.035em;line-height:.95}
h1{font-size:clamp(52px,15vw,96px)}
h2{font-size:clamp(26px,7vw,36px)}
h1 em,h2 em{font-family:var(--accent-face);font-style:normal;font-weight:400;text-transform:none;letter-spacing:-.01em;font-size:1.14em}
p{margin:0}
.label{font:500 11px/1.3 var(--text);letter-spacing:.14em;text-transform:uppercase}
.soft{color:var(--soft)}
figure{margin:0}
figure img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;object-position:50% 78%}
.hero{padding:40px 20px 36px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px}
.hero p{max-width:34ch}
.lead{font-size:17px}
.bio{display:flex;flex-direction:column;align-items:center;gap:6px}
.aside{font-size:14px}
.hero .tags{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;max-width:36ch}
.tags i{font-style:normal}
.go{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:26px 20px;text-decoration:none;transition:background .2s,color .2s}
.go:hover{background:var(--ink);color:var(--on-ink)}
.go:hover .soft{color:var(--on-ink)}
.go div{display:flex;flex-direction:column;gap:8px;min-width:0}
.go i{display:grid;place-items:center;width:38px;height:38px;border:1px solid currentColor;border-radius:50%;flex:none}
.foot{padding:22px 20px;display:flex;gap:22px;justify-content:center;border-bottom:0}
.foot a{text-decoration:none}
.foot a:hover{text-decoration:underline;text-underline-offset:4px}
/* Desktop: photo on the left, everything else on the right, one screen tall. */
@media (min-width:860px){
  body{padding-block:0}
  .frame{max-width:1120px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr auto auto auto;height:100vh;height:100dvh;min-height:540px}
  figure{grid-column:1;grid-row:1/-1;min-height:0;border-bottom:0;border-right:1px solid var(--rule)}
  figure img{height:100%;aspect-ratio:auto;object-position:50% 85%}
  .hero,.go,.foot{grid-column:2}
  .hero{justify-content:center;padding:32px 40px;min-height:0}
  .go{padding:24px 32px}
  h1{font-size:clamp(48px,5.6vw,76px)}
  h2{font-size:clamp(24px,2.6vw,32px)}
}
</style>
</head>
<body>
<div class="frame">
  <figure><img src="/img/corrida.jpg" alt="Gabi correndo à beira da água no fim da tarde"></figure>
  <section class="hero">
    <span class="label">@gabizorzo</span>
    <h1>Gabi <em>Zorzo</em></h1>
    <div class="bio"><p class="lead">Levo uma vida em movimento sem abrir mão do equilíbrio.</p><p class="aside soft">Atleta híbrida que fala né?</p></div>
    <p class="label tags"><span>Corrida</span><i>✱</i><span>CrossFit</span><i>✱</i><span>Hyrox</span><i>✱</i><span>Viagens</span><i>✱</i><span>O que mais vier</span></p>
  </section>
  <a class="go" href="/cupons/">
    <div><h2>Meus <em>cupons</em></h2><span class="label soft">Descontos nas marcas parceiras</span></div>
    <i><svg aria-hidden="true" width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7 H12 M8 3 L12 7 L8 11"/></svg></i>
  </a>
  <a class="go" href="/midiakit/">
    <div><h2>Mídia <em>kit</em></h2><span class="label soft">Para marcas e parcerias</span></div>
    <i><svg aria-hidden="true" width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2 7 H12 M8 3 L12 7 L8 11"/></svg></i>
  </a>
  <footer class="foot label">
    <a href="https://instagram.com/gabizorzo">Instagram</a>
    <a href="https://www.tiktok.com/@gabizorzo">TikTok</a>
  </footer>
</div>
</body>
</html>
